version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: snapserve-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snapserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SnapServeSecure2025!}
      POSTGRES_DB: ${POSTGRES_DB:-snapserve}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapserve} -d ${POSTGRES_DB:-snapserve}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapserve-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-snapserve}:${POSTGRES_PASSWORD:-SnapServeSecure2025!}@db:5432/${POSTGRES_DB:-snapserve}?schema=public
      JWT_SECRET: ${JWT_SECRET:-snapserve_super_secret_jwt_production_2025}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BCRYPT_ROUNDS: 12
      MAX_FILE_SIZE_MB: 25
      UPLOAD_DIR: ./uploads
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snapserve-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
